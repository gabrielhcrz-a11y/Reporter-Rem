name: Compilar APK REM Industries

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake

      - name: Instalar Buildozer e Cython estável
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36 setuptools

      - name: Compilar APK com Buildozer
        run: |
          buildozer android debug

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: Reporte-REM-APK
          path: bin/*.apk
